<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة الملحق الثالث</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* هوية محتواي، الوضع الفاتح دائما. الجوال: عمود واحد. اللابتوب: ترويسة بعرض الصفحة، ثم عمود جانبي ثابت للملخص وما ينتظر التعليمات، وعمود رئيسي للبنود. */
:root{
  --teal:#189C9C; --teal-deep:#0F7373; --teal-soft:#E4F4F3; --teal-wash:#F1F9F8;
  --gold:#D7B65A; --gold-ink:#9A7A22; --gold-soft:#FBF4E0;
  --ink:#0E3E41; --muted:#5E7A7C; --line:#DCEAE9;
  --bg:#F3F8F7; --surface:#FFFFFF; --done:#189C9C; --todo:#B9CACA;
  --font:"Tajawal", "Segoe UI", Tahoma, sans-serif;
  --shadow:0 1px 2px rgba(14,62,65,.04), 0 8px 24px rgba(14,62,65,.06);
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}

/* الترويسة */
.hero{position:relative;overflow:hidden;padding:18px 20px 22px;
  background:radial-gradient(70% 140% at 100% 0%, var(--teal-soft) 0%, transparent 60%),
             radial-gradient(60% 140% at 0% 100%, var(--gold-soft) 0%, transparent 55%), var(--surface);
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"logo client" "title title";gap:14px 12px;align-items:center}
.hero::after{content:"";position:absolute;width:140px;height:140px;left:-50px;top:-50px;border-radius:36px;
  transform:rotate(45deg);background:var(--teal);opacity:.07;pointer-events:none}
.logo{grid-area:logo;display:flex}
.logo img{height:42px;width:auto;display:block}
.client{grid-area:client;color:var(--teal-deep);font-weight:700;font-size:15px;position:relative;z-index:1}
.hero h1{grid-area:title;margin:0;font-size:25px;line-height:1.35;font-weight:800;text-align:center;text-wrap:balance}

/* التخطيط */
.layout{display:flex;flex-direction:column;gap:16px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}

/* الملخص */
.summary{padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.sum-title{margin:0;font-size:16px;font-weight:700;color:var(--teal-deep)}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.lg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px;border-radius:16px;background:var(--teal-wash)}
.lg b{font-size:34px;font-weight:800;line-height:1.1;color:var(--teal-deep)}
.lg.s-waiting b{color:var(--gold-ink)} .lg.s-todo b{color:var(--muted)}
.lg span{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.lg i{width:8px;height:8px;border-radius:50%;flex:none}
.lg.s-done i{background:var(--done)} .lg.s-doing i{background:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.lg.s-waiting{background:var(--gold-soft)} .lg.s-waiting i{background:var(--gold)} .lg.s-todo i{background:var(--todo)}
.updated{font-size:13px;color:var(--muted)}

/* في انتظار التعليمات */
.waiting{background:var(--gold-soft);border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.waiting h2{margin:0;font-size:16px;font-weight:700;color:var(--gold-ink)}
.waiting ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.waiting li{display:flex;flex-direction:column;padding-right:18px;position:relative;line-height:1.5}
.waiting li::before{content:"";position:absolute;right:0;top:.55em;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--gold)}
.waiting li strong{font-weight:700;font-size:15px}
.waiting li span{color:var(--muted);font-size:13px}

/* البنود */
.items{display:flex;flex-direction:column;gap:12px;min-width:0}
details.item{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
details.item summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
details.item summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:20px}
.num{width:40px;height:40px;display:grid;place-items:center;position:relative;color:#fff;font-weight:800;font-size:17px}
.num::before{content:"";position:absolute;inset:5px;border-radius:9px;background:var(--teal);transform:rotate(45deg)}
.num span{position:relative;display:grid;place-items:center}
.num svg{width:16px;height:16px}
.it-head{min-width:0;display:flex;flex-direction:column;gap:6px}
.it-title{font-weight:700;font-size:17px;line-height:1.45}
.it-meta{font-size:13px;color:var(--muted)}
.mini{height:6px;background:var(--teal-soft);border-radius:99px;overflow:hidden}
.mini>span{display:block;height:100%;background:var(--teal);border-radius:99px}
.chev{width:22px;height:22px;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
/* بند اكتملت كل خطواته */
details.item.complete{background:var(--teal-wash);box-shadow:none;border:1.5px solid var(--teal)}
.complete .it-title{color:var(--teal-deep)}
.done-pill{display:inline-flex;align-items:center;gap:4px;margin-inline-start:8px;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--teal);color:#fff;vertical-align:middle}
.done-pill svg{width:12px;height:12px}

ol.tasks{list-style:none;margin:0;padding:0 18px 8px;display:grid;grid-template-columns:1fr}
ol.tasks li{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.ic svg{width:14px;height:14px}
.s-done .ic{background:var(--done);color:#fff}
.s-doing .ic{border:2px solid var(--teal);background:var(--teal-soft)}
.s-doing .ic::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.s-waiting .ic{border:2px solid var(--gold);background:var(--gold-soft)}
.s-waiting .ic::after{content:"";width:9px;height:2px;background:var(--gold-ink);border-radius:2px}
.s-todo .ic{border:2px solid var(--todo)}
.t-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.t-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.t-title{line-height:1.6;font-size:15px}
.s-done .t-title{color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;white-space:nowrap}
.s-done .chip{background:var(--teal-soft);color:var(--teal-deep)}
.s-doing .chip{background:var(--teal);color:#fff}
.s-waiting .chip{background:var(--gold-soft);color:var(--gold-ink)}
.s-todo .chip{background:var(--teal-wash);color:var(--muted)}
.t-note{font-size:13px;color:var(--muted)}

footer{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);text-align:center;padding-top:4px}

@media (max-width:420px){.hero h1{font-size:23px}.logo img{height:36px}}

/* لابتوب */
@media (min-width:900px){
  .wrap{padding-block:28px 48px;gap:20px}
  .hero{grid-template-columns:1fr auto 1fr;grid-template-areas:"logo title client";padding:22px 28px}
  .client{justify-self:end;font-size:16px}
  .hero h1{font-size:30px}
  .logo img{height:48px}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
  .legend{grid-template-columns:repeat(2,1fr)}
  ol.tasks{grid-template-columns:1fr 1fr;column-gap:28px;padding:0 22px 10px}
  details.item summary{padding:18px 22px}
}
@media (min-width:900px) and (max-width:1080px){ol.tasks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero card">
    <span class="logo"><img src="logo.png" alt="محتواي"></span>
    <h1>رحلة تنفيذ الملحق الثالث</h1>
    <span class="client">شركة نوادي الأجيال</span>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="summary card" aria-label="ملخص الخطوات">
        <h2 class="sum-title">ملخص الخطوات</h2>
        <div class="legend" id="legend"></div>
        <div class="updated" id="updated"></div>
      </section>

      <section class="waiting" id="waiting" hidden>
        <h2 id="waitingTitle"></h2>
        <ul id="waitingList"></ul>
      </section>
    </aside>

    <main class="items" id="items" aria-label="البنود"></main>
  </div>

  <footer>
    <span>تُحدَّث هذه الصفحة أسبوعيا مع التقرير.</span>
    <span>المرجع هو نص الملحق الثالث الموقّع.</span>
    <span>متجر محتواي</span>
  </footer>
</div>

<script>
/* ============================================================
   البيانات: المكان الوحيد الذي يُعدَّل.
   الحالة: "done" منجزة · "doing" جارية · "waiting" بانتظار ردكم · "todo" لم تبدأ
   note: سطر اختياري يظهر تحت الخطوة.
   ============================================================ */
const UPDATED = "2026-11-24";
const SHOW_DATES = false; // مواعيد الملحق مخفية حاليًا
const ITEMS = [
  { title: "التجهيزات", prep: true, tasks: [
    { t: "تجهيزات البناء والنشر قبل بدء الأعمال", s: "done" }
  ]},
  { title: "العهد في لوحة الموقع", due: "نهاية ديسمبر ٢٠٢٦", tasks: [
    { t: "خانة «مكان الحفظ» لكل صنف في جرد المستودع", s: "doing", note: "في المراجعة النهائية" },
    { t: "طلب العهد بالتصنيف والصنف والتاريخ، وأكثر من طلب", s: "todo" },
    { t: "إضافة مسؤول العهد أصنافًا من الجرد إلى الطلب، والصرف من رصيد الجرد", s: "todo" },
    { t: "تصحيح السند أو إلغاؤه قبل إقرار مدير الفرع", s: "todo" },
    { t: "إقرار مدير الفرع للسند أو اعتراضه عليه", s: "todo" },
    { t: "كشف عهدة مدير الفرع", s: "todo" },
    { t: "المشتريات بمبلغها", s: "todo" },
    { t: "كشف نهاية الفترة", s: "todo" },
    { t: "جرد نهاية الفترة مع حفظ النقص أو الإرجاع للاستكمال", s: "todo" },
    { t: "تصحيح محضر الإخلاء قبل اعتماده", s: "todo" },
    { t: "الطباعة: كشف العهدة، وكشف نهاية الفترة، وجرد المستودع حسب التصنيف، وجدول العهد فقط", s: "todo" },
    { t: "استمرار رصيد المستودع بأصنافه وكمياته مع السنة الجديدة", s: "todo" },
    { t: "تصحيح أعداد طلاب السنة والمنسحبين قبل الأرشفة", s: "todo" }
  ]},
  { title: "التسجيل والأسابيع في الموقع، وملخص السنة", due: "منتصف يناير ٢٠٢٧", tasks: [
    { t: "حفظ الأسابيع التي اشتراها كل ابن", s: "doing" },
    { t: "حساب سعر الأسابيع حسب عددها", s: "waiting", note: "كم قيمة الأسبوع الواحد؟ المقترح: سعر الباقة ÷ عدد الأسابيع" },
    { t: "التسجيل بأسابيع متفرقة ودفعها مرة واحدة", s: "todo" },
    { t: "تجديد كل ابن على حدة", s: "todo" },
    { t: "الحضور حسب الأسابيع المشتراة", s: "todo" },
    { t: "استرداد أسبوع محدد من الإدارة", s: "waiting", note: "الأسبوع الذي لم يبدأ: هل يُسترد كاملا؟" },
    { t: "عرض برامج الفرع قبل ملخص التسجيل", s: "doing" },
    { t: "السياسة والأحكام بعد اختيار الفرع", s: "todo" },
    { t: "الانتظار بدون دفع مع حفظ الأسابيع المختارة، وإلغاء «الدفع لاحقًا»", s: "todo" },
    { t: "تأكيد أسابيع الانتظار وإرسال رابط الدفع من الإدارة", s: "todo" },
    { t: "وسم «مشترك جديد» بالأحمر", s: "todo" },
    { t: "صفحة «ملخص السنة» حسب الفرع", s: "todo" },
    { t: "طباعة الملخص PDF أو إكسل، وحفظ نسخة ثابتة عند الإقفال", s: "todo" },
    { t: "تجهيز التسجيل والأسابيع لاستخدامها في التطبيق", s: "todo" }
  ]},
  { title: "تطبيق ولي الأمر والطالب", due: "منتصف فبراير ٢٠٢٧", tasks: [
    { t: "تسجيل الابن بالأسابيع من التطبيق", s: "todo" },
    { t: "تجديد كل ابن من التطبيق", s: "todo" },
    { t: "كود الخصم في التسجيل والتجديد", s: "todo" },
    { t: "الانتظار وحفظ الاختيارات من التطبيق", s: "todo" },
    { t: "برامج الفرع والسياسة ضمن خطوات التسجيل", s: "todo" },
    { t: "فاتورة التجديد وتحميلها", s: "todo" },
    { t: "زر تذكرة الزوار ويفتح صفحة الحجز في الموقع", s: "todo" },
    { t: "قائمة أفضل خمسة لولي الأمر", s: "todo" },
    { t: "رقم العضوية للطالب", s: "todo" },
    { t: "الرابح الأكثر للطالب", s: "todo" },
    { t: "قائمة مسابقات الطالب", s: "todo" },
    { t: "حل المسابقة من التطبيق", s: "todo" },
    { t: "نتيجة المسابقة", s: "todo" }
  ]},
  { title: "تطبيق الموظف والمبادرات", due: "نهاية فبراير ٢٠٢٧", tasks: [
    { t: "كشف الحضور الأسبوعي وتحميله", s: "todo" },
    { t: "التأكيد الجماعي للمناداة", s: "todo" },
    { t: "التأكيد الجماعي للخروج", s: "todo" },
    { t: "تحميل عقد الموظف", s: "todo" },
    { t: "فتح وإغلاق استقبال المبادرات", s: "todo" },
    { t: "البرنامج المقترح بفكرته وصوره، ومروره على مدير الفرع ثم مسؤول الميزانية", s: "todo" },
    { t: "إخفاء «المتصدرون» وجوائز تميز الفروع", s: "todo" }
  ]},
  { title: "الفحص والتسليم", due: "الأسبوع الأول من مارس ٢٠٢٧", tasks: [
    { t: "فحص البنود المذكورة", s: "todo" },
    { t: "نشر الموقع ورفع تحديث التطبيق للآيفون والأندرويد", s: "todo" },
    { t: "فيديوهات شرح مختصرة", s: "todo" }
  ]}
];
/* ============================================================ */

const LABEL = { done: "منجزة", doing: "جارية", waiting: "بانتظار ردكم", todo: "لم تبدأ" };
const ORDER = ["done", "doing", "waiting", "todo"];
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const fmtDate = iso => { const [y,m,d] = iso.split("-").map(Number); return `${ar(d)} ${MONTHS[m-1]} ${ar(y)}`; };
const CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const all = ITEMS.flatMap(i => i.tasks);
const count = s => all.filter(t => t.s === s).length;
document.getElementById("legend").innerHTML = ORDER.map(s =>
  `<div class="lg s-${s}"><b>${ar(count(s))}</b><span><i></i>${LABEL[s]}</span></div>`).join("");
document.getElementById("updated").textContent = "آخر تحديث: " + fmtDate(UPDATED);

const waiting = ITEMS.flatMap(i => i.tasks.filter(t => t.s === "waiting"));
if (waiting.length) {
  document.getElementById("waiting").hidden = false;
  document.getElementById("waitingTitle").textContent = "بانتظار ردكم على:";
  document.getElementById("waitingList").innerHTML = waiting.map(t =>
    `<li><strong>${esc(t.note || t.t)}</strong>${t.note ? `<span>${esc(t.t)}</span>` : ""}</li>`).join("");
}

let itemNo = 0;
document.getElementById("items").innerHTML = ITEMS.map((it, idx) => {
  const badge = it.prep ? CHECK : ar(++itemNo);
  const d = it.tasks.filter(t => t.s === "done").length, n = it.tasks.length;
  const active = it.tasks.some(t => t.s !== "todo");
  const complete = d === n;
  const meta = `${ar(d)} من ${ar(n)} منجزة` + (SHOW_DATES && it.due ? ` · الموعد: ${it.due}` : "");
  return `<details class="item${complete ? " complete" : ""}"${active && !complete ? " open" : ""}>
    <summary>
      <span class="num"><span>${badge}</span></span>
      <span class="it-head">
        <span class="it-title">${esc(it.title)}${complete ? `<span class="done-pill">${CHECK}مكتمل</span>` : ""}</span>
        <span class="it-meta">${meta}</span>
        <span class="mini"><span style="width:${Math.round(d / n * 100)}%"></span></span>
      </span>
      ${CHEV}
    </summary>
    <ol class="tasks">${it.tasks.map(t => `
      <li class="s-${t.s}">
        <span class="ic">${t.s === "done" ? CHECK : ""}</span>
        <span class="t-body">
          <span class="t-row"><span class="t-title">${esc(t.t)}</span><span class="chip">${LABEL[t.s]}</span></span>
          ${t.note ? `<span class="t-note">${t.s === "waiting" ? "بانتظار ردكم: " : ""}${esc(t.note)}</span>` : ""}
        </span>
      </li>`).join("")}
    </ol>
  </details>`;
}).join("");
</script>
</body>
</html>
